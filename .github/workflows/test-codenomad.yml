name: Test CodeNomad

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  test-fixed-port:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get latest version
        id: version
        run: echo "version=$(npm view @dyyz1993/codenomad version)" >> $GITHUB_OUTPUT

      - name: Install codenomad
        run: |
          for i in 1 2 3; do
            npm install -g @dyyz1993/codenomad@${{ steps.version.outputs.version }} && break || sleep 10
          done

      - name: Start with fixed port
        run: |
          codenomad --password testpass123 --host 127.0.0.1 --http-port 19899 --http true --unrestricted-root > /tmp/codenomad-fixed.log 2>&1 &
          echo "CODENOMAD_PID=$!" >> $GITHUB_ENV
          sleep 15

      - name: Wait for server ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19899/api/auth/status > /dev/null 2>&1; then
              echo "Server is ready on port 19899"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Test endpoints
        run: |
          echo "## Fixed Port (19899) Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:19899/)
          echo "| GET / | $STATUS | $( [ "$STATUS" = "302" ] && echo '✅ Redirect to login' || echo '❌ Expected 302' ) |" >> $GITHUB_STEP_SUMMARY

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:19899/login)
          echo "| GET /login | $STATUS | $( [ "$STATUS" = "200" ] && echo '✅ Login page OK' || echo '❌ Expected 200' ) |" >> $GITHUB_STEP_SUMMARY

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:19899/api/auth/status)
          BODY=$(curl -sf http://127.0.0.1:19899/api/auth/status 2>/dev/null || echo "failed")
          echo "| GET /api/auth/status | $STATUS | Body: \`$BODY\` |" >> $GITHUB_STEP_SUMMARY

      - name: Test login flow
        id: login
        run: |
          echo "### Login Flow Test" >> $GITHUB_STEP_SUMMARY

          LOGIN_RESPONSE=$(curl -sv -c /tmp/cookies.txt -X POST http://127.0.0.1:19899/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"codenomad","password":"testpass123"}' 2>&1)
          LOGIN_STATUS=$(echo "$LOGIN_RESPONSE" | grep "< HTTP" | tail -1 | awk '{print $3}')
          LOGIN_BODY=$(echo "$LOGIN_RESPONSE" | grep -v "^[<>*{]" | tail -1)

          echo "| Step | Status | Response |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| POST /api/auth/login | $LOGIN_STATUS | \`$(echo $LOGIN_BODY | head -c 200)\` |" >> $GITHUB_STEP_SUMMARY

          STATUS_RESPONSE=$(curl -s -b /tmp/cookies.txt http://127.0.0.1:19899/api/auth/status 2>/dev/null || echo "failed")
          echo "| GET /api/auth/status (after login) | - | \`$(echo $STATUS_RESPONSE | head -c 200)\` |" >> $GITHUB_STEP_SUMMARY

          MAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt -L http://127.0.0.1:19899/)
          echo "| GET / (with auth cookie) | $MAIN_STATUS | $( [ "$MAIN_STATUS" = "200" ] && echo '✅ Main page accessible' || echo '❌ Cannot access main page' ) |" >> $GITHUB_STEP_SUMMARY

          if echo "$LOGIN_BODY" | grep -qi "error\|fail\|unauthorized\|invalid"; then
            echo "login_result=failed" >> $GITHUB_OUTPUT
            echo "⚠️ **Login FAILED** - response: \`$LOGIN_BODY\`" >> $GITHUB_STEP_SUMMARY
          elif [ "$LOGIN_STATUS" = "200" ] || [ "$LOGIN_STATUS" = "302" ]; then
            echo "login_result=success" >> $GITHUB_OUTPUT
            echo "✅ **Login succeeded** (HTTP $LOGIN_STATUS)" >> $GITHUB_STEP_SUMMARY
          else
            echo "login_result=unknown" >> $GITHUB_OUTPUT
            echo "⚠️ **Login result unclear** - HTTP $LOGIN_STATUS, body: \`$LOGIN_BODY\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test browse filesystem after login
        run: |
          BROWSE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt "http://127.0.0.1:19899/api/filesystem/browse?path=/tmp")
          echo "| GET /api/filesystem/browse?path=/tmp | $BROWSE_STATUS |" >> $GITHUB_STEP_SUMMARY

          ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt "http://127.0.0.1:19899/api/filesystem/browse")
          echo "| GET /api/filesystem/browse (root) | $ROOT_STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Test auth lifecycle
        run: |
          echo "### Auth Lifecycle Tests" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          # Test logout
          LOGOUT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt -X POST http://127.0.0.1:19899/api/auth/logout)
          echo "| POST /api/auth/logout | $LOGOUT_STATUS | $( [ "$LOGOUT_STATUS" = "200" ] && echo '✅ Logout OK' || echo '❌ Expected 200' ) |" >> $GITHUB_STEP_SUMMARY

          # Test unauthenticated access after logout
          UNAUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:19899/api/auth/status)
          UNAUTH_BODY=$(curl -s -b /tmp/cookies.txt http://127.0.0.1:19899/api/auth/status 2>/dev/null || echo "failed")
          echo "| GET /api/auth/status (after logout) | $UNAUTH_STATUS | Body: \`$(echo $UNAUTH_BODY | head -c 200)\` |" >> $GITHUB_STEP_SUMMARY

          # Re-login for subsequent tests
          curl -sv -c /tmp/cookies.txt -X POST http://127.0.0.1:19899/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"codenomad","password":"testpass123"}' 2>&1 > /dev/null

          # Test meta endpoint
          META_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:19899/api/meta)
          echo "| GET /api/meta | $META_STATUS | $( [ "$META_STATUS" = "200" ] && echo '✅ Meta OK' || echo '❌ Expected 200' ) |" >> $GITHUB_STEP_SUMMARY

          # Test settings endpoint
          SETTINGS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:19899/api/storage/config)
          echo "| GET /api/storage/config | $SETTINGS_STATUS | $( [ "$SETTINGS_STATUS" = "200" ] && echo '✅ Settings OK' || echo '❌ Expected 200' ) |" >> $GITHUB_STEP_SUMMARY

          # Test SSE events endpoint
          SSE_PID=$(timeout 3 curl -s -N -b /tmp/cookies.txt http://127.0.0.1:19899/api/events 2>/dev/null | head -c 100 &)
          sleep 1
          echo "| GET /api/events (SSE) | - | ✅ SSE connection attempted |" >> $GITHUB_STEP_SUMMARY

      - name: Test workspace APIs
        run: |
          echo "### Workspace API Tests" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          # List workspaces (should be empty or return array)
          WS_LIST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:19899/api/workspaces)
          WS_LIST_BODY=$(curl -s -b /tmp/cookies.txt http://127.0.0.1:19899/api/workspaces 2>/dev/null || echo "failed")
          echo "| GET /api/workspaces | $WS_LIST_STATUS | Body: \`$(echo $WS_LIST_BODY | head -c 300)\` |" >> $GITHUB_STEP_SUMMARY

          # Test filesystem browse
          FS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt "http://127.0.0.1:19899/api/filesystem?path=/tmp")
          echo "| GET /api/filesystem?path=/tmp | $FS_STATUS | $( [ "$FS_STATUS" = "200" ] && echo '✅ Filesystem OK' || echo '❌ Expected 200' ) |" >> $GITHUB_STEP_SUMMARY

          # Test storage instances
          STORAGE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:19899/api/storage/instances/test-id 2>/dev/null || echo "404")
          echo "| GET /api/storage/instances/:id | $STORAGE_STATUS | Storage endpoint checked |" >> $GITHUB_STEP_SUMMARY

          # Test sidecars
          SIDECAR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:19899/api/sidecars 2>/dev/null || echo "000")
          echo "| GET /api/sidecars | $SIDECAR_STATUS | Sidecar endpoint checked |" >> $GITHUB_STEP_SUMMARY

      - name: Collect server logs
        if: always()
        run: |
          echo "### Server Logs (Fixed Port)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/codenomad-fixed.log 2>/dev/null | tail -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Stop server
        if: always()
        run: kill $CODENOMAD_PID 2>/dev/null || true

  test-port-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get latest version
        id: version
        run: echo "version=$(npm view @dyyz1993/codenomad version)" >> $GITHUB_OUTPUT

      - name: Install codenomad
        run: |
          for i in 1 2 3; do
            npm install -g @dyyz1993/codenomad@${{ steps.version.outputs.version }} && break || sleep 10
          done

      - name: Occupy default port 9899
        run: |
          python3 -c "
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(('127.0.0.1', 9899))
          s.listen(1)
          print('Dummy server listening on 9899', flush=True)
          while True:
              time.sleep(60)
          " &
          echo "DUMMY_PID=$!" >> $GITHUB_ENV
          sleep 2
          ss -tlnp | grep ':9899' && echo "Port 9899 is occupied (dummy server running)" || echo "WARNING: Port 9899 not occupied"

      - name: Start codenomad without port (should fallback)
        run: |
          codenomad --password testpass123 --host 127.0.0.1 --http true --unrestricted-root > /tmp/codenomad-fallback.log 2>&1 &
          echo "CODENOMAD_PID=$!" >> $GITHUB_ENV
          sleep 20

      - name: Detect actual port
        id: detect_port
        run: |
          echo "### Port Fallback Detection" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/codenomad-fallback.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          ACTUAL_URL=$(grep -oP 'Local Connection URL\s*:\s*\Khttps?://[^\s]+' /tmp/codenomad-fallback.log | head -1)
          ACTUAL_PORT=$(echo "$ACTUAL_URL" | grep -oP ':\K\d+' | head -1)

          if [ -z "$ACTUAL_PORT" ]; then
            ACTUAL_PORT=$(ss -tlnp 2>/dev/null | grep "pid=$CODENOMAD_PID" | head -1 | grep -oP ':\K\d+' | head -1)
          fi

          if [ -z "$ACTUAL_PORT" ]; then
            ACTUAL_PORT=$(ss -tlnp 2>/dev/null | grep -v '9899' | grep 'LISTEN' | tail -1 | grep -oP ':\K\d+' | head -1)
          fi

          if [ -z "$ACTUAL_PORT" ]; then
            echo "Waiting longer for server to start..."
            sleep 10
            ACTUAL_URL=$(grep -oP 'Local Connection URL\s*:\s*\Khttps?://[^\s]+' /tmp/codenomad-fallback.log | head -1)
            ACTUAL_PORT=$(echo "$ACTUAL_URL" | grep -oP ':\K\d+' | head -1)
          fi

          if [ -z "$ACTUAL_PORT" ]; then
            ACTUAL_PORT=$(ss -tlnp 2>/dev/null | grep -v '9899' | grep 'LISTEN' | tail -1 | grep -oP ':\K\d+' | head -1)
          fi

          if [ -z "$ACTUAL_PORT" ]; then
            echo "❌ Could not detect actual port!" >> $GITHUB_STEP_SUMMARY
            echo "port=unknown" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Detected actual port: $ACTUAL_PORT" >> $GITHUB_STEP_SUMMARY
          echo "url=http://127.0.0.1:$ACTUAL_PORT" >> $GITHUB_OUTPUT
          echo "port=$ACTUAL_PORT" >> $GITHUB_OUTPUT

          if [ "$ACTUAL_PORT" = "9899" ]; then
            echo "⚠️ **Port did NOT fallback - still on default 9899**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Port fallback working - using ephemeral port $ACTUAL_PORT**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test endpoints on fallback port
        run: |
          PORT=${{ steps.detect_port.outputs.port }}
          BASE="http://127.0.0.1:$PORT"

          echo "## Port Fallback ($PORT) Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/" 2>/dev/null || echo "000")
          echo "| GET / | $STATUS | $( [ "$STATUS" = "302" ] && echo '✅' || echo '❌ Expected 302' ) |" >> $GITHUB_STEP_SUMMARY

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/login" 2>/dev/null || echo "000")
          echo "| GET /login | $STATUS | $( [ "$STATUS" = "200" ] && echo '✅ Login page OK' || echo '❌ Expected 200' ) |" >> $GITHUB_STEP_SUMMARY

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/auth/status" 2>/dev/null || echo "000")
          BODY=$(curl -sf "$BASE/api/auth/status" 2>/dev/null || echo "ERR_CONNECTION_REFUSED")
          echo "| GET /api/auth/status | $STATUS | Body: \`$BODY\` |" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" = "000" ] || [ "$BODY" = "ERR_CONNECTION_REFUSED" ]; then
            echo "❌ **CRITICAL: Connection refused on fallback port $PORT - UI would be broken!**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test login on fallback port
        id: login_fallback
        run: |
          PORT=${{ steps.detect_port.outputs.port }}
          BASE="http://127.0.0.1:$PORT"

          echo "### Login Flow on Fallback Port ($PORT)" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status | Response |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|----------|" >> $GITHUB_STEP_SUMMARY

          LOGIN_RESPONSE=$(curl -sv -c /tmp/cookies-fallback.txt -X POST "$BASE/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"codenomad","password":"testpass123"}' 2>&1)
          LOGIN_STATUS=$(echo "$LOGIN_RESPONSE" | grep "< HTTP" | tail -1 | awk '{print $3}')
          LOGIN_BODY=$(echo "$LOGIN_RESPONSE" | sed -n '/^{/,/^}/p' | tail -1)

          [ -z "$LOGIN_STATUS" ] && LOGIN_STATUS="000"
          [ -z "$LOGIN_BODY" ] && LOGIN_BODY="no response body"

          echo "| POST /api/auth/login | $LOGIN_STATUS | \`$(echo $LOGIN_BODY | head -c 200)\` |" >> $GITHUB_STEP_SUMMARY

          if [ "$LOGIN_STATUS" = "000" ]; then
            echo "❌ **LOGIN FAILED: ERR_CONNECTION_REFUSED on port $PORT**" >> $GITHUB_STEP_SUMMARY
            echo "This is the exact bug: server fell back to port $PORT but login POST fails!" >> $GITHUB_STEP_SUMMARY
            echo "login_result=connection_refused" >> $GITHUB_OUTPUT
          else
            STATUS_RESPONSE=$(curl -s -b /tmp/cookies-fallback.txt "$BASE/api/auth/status" 2>/dev/null || echo "failed")
            echo "| GET /api/auth/status (after login) | - | \`$(echo $STATUS_RESPONSE | head -c 200)\` |" >> $GITHUB_STEP_SUMMARY

            MAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies-fallback.txt -L "$BASE/")
            echo "| GET / (with auth) | $MAIN_STATUS | $( [ "$MAIN_STATUS" = "200" ] && echo '✅' || echo '❌' ) |" >> $GITHUB_STEP_SUMMARY

            echo "login_result=status_${LOGIN_STATUS}" >> $GITHUB_OUTPUT
          fi

      - name: Collect all logs
        if: always()
        run: |
          echo "### Full Server Logs (Fallback)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/codenomad-fallback.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dummy Server Logs (Port 9899)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/dummy-9899.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Stop all processes
        if: always()
        run: |
          kill $CODENOMAD_PID 2>/dev/null || true
          kill $DUMMY_PID 2>/dev/null || true

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: cd packages/ui && npm run build
      - run: cd packages/server && npm run build:server-only 2>/dev/null || npx tsc -p tsconfig.json
      - run: npm run typecheck
      - name: Run server unit tests
        run: npx tsx --test src/**/*.test.ts
        working-directory: packages/server
      - name: Run UI unit tests
        run: npx tsx --test src/**/*.test.ts
        working-directory: packages/ui

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get latest version
        id: version
        run: echo "version=$(npm view @dyyz1993/codenomad version)" >> $GITHUB_OUTPUT

      - name: Install codenomad
        run: |
          for i in 1 2 3; do
            npm install -g @dyyz1993/codenomad@${{ steps.version.outputs.version }} && break || sleep 10
          done

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start CodeNomad server
        run: |
          mkdir -p /tmp/codenomad-e2e-config
          codenomad \
            --password e2etest \
            --host 127.0.0.1 \
            --http-port 19899 \
            --http true \
            --unrestricted-root \
            --config /tmp/codenomad-e2e-config \
            --auth-cookie-name codenomad-e2e \
            > /tmp/codenomad-e2e.log 2>&1 &
          echo "CODENOMAD_PID=$!" >> $GITHUB_ENV

      - name: Wait for server ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19899/api/auth/status > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          curl -sf http://127.0.0.1:19899/api/auth/status > /dev/null || (echo "=== Server log ===" && cat /tmp/codenomad-e2e.log && exit 1)

      - name: Run E2E smoke tests
        env:
          E2E_BASE_URL: http://127.0.0.1:19899
          E2E_PASSWORD: e2etest
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: /tmp/codenomad-e2e.log
          retention-days: 7

      - name: Stop server
        if: always()
        run: kill $CODENOMAD_PID 2>/dev/null || true

  tunnel-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build tunnel-hub
        run: |
          git clone https://github.com/dyyz1993/codenomad-tunnel.git /tmp/codenomad-tunnel
          cd /tmp/codenomad-tunnel
          go build -o /tmp/tunnel-hub ./cmd/hub

      - name: Build CodeNomad from source
        run: |
          npm install
          npm run build

      - name: Start test HTTP service
        run: |
          mkdir -p /tmp/tunnel-test
          echo "Hello from tunnel test" > /tmp/tunnel-test/index.html
          python3 -m http.server 18888 --directory /tmp/tunnel-test &
          echo "HTTP_PID=$!" >> $GITHUB_ENV
          sleep 1
          curl -sf http://127.0.0.1:18888/ > /dev/null || (echo "Test HTTP service failed to start" && exit 1)

      - name: Start tunnel-hub
        run: |
          /tmp/tunnel-hub \
            --domain "*.tunnel.test" \
            --http-port 19080 \
            --api-port 19081 \
            --public-url "http://127.0.0.1:19080" \
            > /tmp/tunnel-hub.log 2>&1 &
          echo "HUB_PID=$!" >> $GITHUB_ENV
          sleep 2
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:19081/api/health > /dev/null 2>&1; then
              echo "Tunnel hub is ready"
              break
            fi
            echo "Waiting for hub... ($i/10)"
            sleep 1
          done

      - name: Start CodeNomad server
        run: |
          node packages/server/dist/index.js \
            --password testpass \
            --host 127.0.0.1 \
            --http-port 19899 \
            --http true \
            --unrestricted-root \
            --tunnel-hub-url http://127.0.0.1:19081 \
            > /tmp/codenomad-tunnel.log 2>&1 &
          echo "CODENOMAD_PID=$!" >> $GITHUB_ENV
          sleep 5
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19899/api/auth/status > /dev/null 2>&1; then
              echo "CodeNomad server is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Login to CodeNomad
        run: |
          curl -sv -c /tmp/cn-cookies.txt -X POST http://127.0.0.1:19899/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"codenomad","password":"testpass"}' 2>&1 > /tmp/login-response.txt
          echo "Login response:"
          cat /tmp/login-response.txt | grep -v "^[<>*]" | tail -5

      - name: Test tunnel creation via CodeNomad API
        id: create_tunnel
        run: |
          echo "## Tunnel Integration Test" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          CREATE_RESPONSE=$(curl -s -b /tmp/cn-cookies.txt \
            -X POST http://127.0.0.1:19899/api/tunnels \
            -H "Content-Type: application/json" \
            -d '{"targetHost":"127.0.0.1","targetPort":18888}')
          echo "$CREATE_RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$CREATE_RESPONSE"

          TUNNEL_ID=$(echo "$CREATE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          SUBDOMAIN=$(echo "$CREATE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('subdomain',''))" 2>/dev/null || true)
          PUBLIC_URL=$(echo "$CREATE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('publicUrl',''))" 2>/dev/null || true)

          echo "| POST /api/tunnels | 200 | id=$TUNNEL_ID subdomain=$SUBDOMAIN |" >> $GITHUB_STEP_SUMMARY

          if [ -z "$TUNNEL_ID" ]; then
            echo "❌ Tunnel creation failed" >> $GITHUB_STEP_SUMMARY
            echo "Response: $CREATE_RESPONSE" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "tunnel_id=$TUNNEL_ID" >> $GITHUB_OUTPUT
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "public_url=$PUBLIC_URL" >> $GITHUB_OUTPUT
          echo "✅ Tunnel created: $TUNNEL_ID ($SUBDOMAIN)" >> $GITHUB_STEP_SUMMARY

      - name: Verify tunnel connected
        run: |
          sleep 3

          echo "### Verify Tunnel Status" >> $GITHUB_STEP_SUMMARY

          TUNNELS_RESPONSE=$(curl -s -b /tmp/cn-cookies.txt http://127.0.0.1:19899/api/tunnels)
          echo "CodeNomad tunnels: $TUNNELS_RESPONSE" | head -c 500 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          STATUS_RESPONSE=$(curl -s http://127.0.0.1:19081/api/tunnels 2>/dev/null || echo "failed")
          echo "Hub tunnels: $STATUS_RESPONSE" | head -c 500 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TUNNEL_STATUS=$(echo "$TUNNELS_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          tunnels = data.get('tunnels', [])
          for t in tunnels:
              print(t.get('status', 'unknown'))
          " 2>/dev/null | head -1 || echo "parse-error")

          echo "| Tunnel status | - | $TUNNEL_STATUS |" >> $GITHUB_STEP_SUMMARY

          if [ "$TUNNEL_STATUS" = "connected" ]; then
            echo "✅ Tunnel is connected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Tunnel status: $TUNNEL_STATUS (may still be connecting)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify tunnel forwarding
        run: |
          SUBDOMAIN="${{ steps.create_tunnel.outputs.subdomain }}"
          echo "### Verify Traffic Forwarding" >> $GITHUB_STEP_SUMMARY
          echo "Testing with Host header: $SUBDOMAIN.tunnel.test" >> $GITHUB_STEP_SUMMARY

          sleep 2

          RESPONSE=$(curl -s -H "Host: ${SUBDOMAIN}.tunnel.test" http://127.0.0.1:19080/ --max-time 10 2>&1 || echo "CURL_FAILED")

          echo "| Forward test | - | Response: \`$(echo "$RESPONSE" | head -c 200)\` |" >> $GITHUB_STEP_SUMMARY

          if echo "$RESPONSE" | grep -q "Hello from tunnel test"; then
            echo "✅ **Tunnel forwarding works** - traffic correctly proxied through hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Tunnel forwarding check inconclusive" >> $GITHUB_STEP_SUMMARY
            echo "Response was: $RESPONSE" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test tunnel status endpoint
        run: |
          STATUS_RESPONSE=$(curl -s -b /tmp/cn-cookies.txt http://127.0.0.1:19899/api/tunnels/status)
          echo "| GET /api/tunnels/status | - | \`$(echo $STATUS_RESPONSE | head -c 300)\` |" >> $GITHUB_STEP_SUMMARY

          TEST_CONN_RESPONSE=$(curl -s -b /tmp/cn-cookies.txt \
            -X POST http://127.0.0.1:19899/api/tunnels/test-connection \
            -H "Content-Type: application/json" \
            -d '{"hubUrl":"http://127.0.0.1:19081"}')
          echo "| POST /api/tunnels/test-connection | - | \`$(echo $TEST_CONN_RESPONSE | head -c 300)\` |" >> $GITHUB_STEP_SUMMARY

      - name: Collect logs
        if: always()
        run: |
          echo "### Tunnel Hub Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 /tmp/tunnel-hub.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### CodeNomad Server Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 /tmp/codenomad-tunnel.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Stop all processes
        if: always()
        run: |
          kill $CODENOMAD_PID 2>/dev/null || true
          kill $HUB_PID 2>/dev/null || true
          kill $HTTP_PID 2>/dev/null || true

  report:
    runs-on: ubuntu-latest
    needs: [test-fixed-port, test-port-fallback, build-test, e2e-smoke, tunnel-integration]
    if: always()
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check results
        id: results
        run: |
          FIXED="${{ needs.test-fixed-port.result }}"
          FALLBACK="${{ needs.test-port-fallback.result }}"
          BUILD="${{ needs.build-test.result }}"
          E2E="${{ needs.e2e-smoke.result }}"
          TUNNEL="${{ needs.tunnel-integration.result }}"

          echo "fixed=$FIXED" >> $GITHUB_OUTPUT
          echo "fallback=$FALLBACK" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "e2e=$E2E" >> $GITHUB_OUTPUT
          echo "tunnel=$TUNNEL" >> $GITHUB_OUTPUT

          if [ "$FIXED" != "success" ] || [ "$FALLBACK" != "success" ] || [ "$BUILD" != "success" ] || [ "$E2E" != "success" ] || [ "$TUNNEL" != "success" ]; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on failure
        if: steps.results.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[CI] Test failures detected - $(date +%Y-%m-%d)"
          BODY="## CI Test Failure Report

          **Date**: $(date -u)
          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Results
          | Job | Status |
          |-----|--------|
           | Fixed Port Test | ${{ needs.test-fixed-port.result }} |
           | Port Fallback Test | ${{ needs.test-port-fallback.result }} |
           | Build Test | ${{ needs.build-test.result }} |
            | E2E Smoke Test | ${{ needs.e2e-smoke.result }} |
            | Tunnel Integration | ${{ needs.tunnel-integration.result }} |

            ### Failing Jobs
            "

            if [ "${{ needs.test-fixed-port.result }}" != "success" ]; then
              BODY+="- ❌ **Fixed Port Test**: Server start or login failed on fixed port
            "
            fi

            if [ "${{ needs.test-port-fallback.result }}" != "success" ]; then
              BODY+="- ❌ **Port Fallback Test**: Server port fallback or login failed - UI connection broken after port change
            "
            fi

            if [ "${{ needs.build-test.result }}" != "success" ]; then
              BODY+="- ❌ **Build Test**: Source code build or typecheck failed
            "
            fi

            if [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
              BODY+="- ❌ **E2E Smoke Test**: Playwright end-to-end tests failed
            "
            fi

            if [ "${{ needs.tunnel-integration.result }}" != "success" ]; then
              BODY+="- ❌ **Tunnel Integration**: Tunnel hub + CodeNomad tunnel creation or forwarding failed
            "
            fi

          BODY+="
          ---
          *This issue was automatically created by the CI workflow.*
          Labels: bug, ci-failure"

          EXISTING=$(gh issue list --repo dyyz1993/CodeNomad --state open --label 'ci-failure' --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --repo dyyz1993/CodeNomad --body "🔄 **New failure detected** - $(date -u)
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>/dev/null || true
          else
            echo "Creating new issue"
            gh issue create --repo dyyz1993/CodeNomad \
              --title "$TITLE" \
              --body "$BODY" \
              --label 'bug' 2>/dev/null || \
            gh issue create --repo dyyz1993/CodeNomad \
              --title "$TITLE" \
              --body "$BODY" 2>/dev/null || true
          fi

      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Fixed Port + Login | ${{ needs.test-fixed-port.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port Fallback + Login | ${{ needs.test-port-fallback.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build + TypeCheck | ${{ needs.build-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Smoke | ${{ needs.e2e-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tunnel Integration | ${{ needs.tunnel-integration.result }} |" >> $GITHUB_STEP_SUMMARY
