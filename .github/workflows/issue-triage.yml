name: Issue Triage

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Open Issues Report" >> $GITHUB_STEP_SUMMARY
          echo "Generated at: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          ISSUES=$(gh issue list --repo dyyz1993/CodeNomad --state open --json number,title,labels,createdAt,body --limit 50)
          echo "$ISSUES" | jq -r '.[] | "- #\(.number) \(.title) [\(.labels | map(.name) | join(", "))]"' >> $GITHUB_STEP_SUMMARY
          
          echo "$ISSUES" > /tmp/issues.json
          
          COUNT=$(echo "$ISSUES" | jq 'length')
          echo "**Total open issues: $COUNT**" >> $GITHUB_STEP_SUMMARY
          
      - name: Auto-label bug reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES=$(cat /tmp/issues.json)
          
          echo "$ISSUES" | jq -c '.[]' | while read -r issue; do
            NUMBER=$(echo "$issue" | jq -r '.number')
            TITLE=$(echo "$issue" | jq -r '.title' | tr '[:upper:]' '[:lower:]')
            BODY=$(echo "$issue" | jq -r '.body // ""' | tr '[:upper:]' '[:lower:]')
            LABELS=$(echo "$issue" | jq -r '.labels | map(.name) | join(",")')
            
            if echo "$TITLE $BODY" | grep -qiE 'error|fail|crash|bug|broken|fix|issue'; then
              if ! echo "$LABELS" | grep -q 'bug'; then
                gh issue edit "$NUMBER" --repo dyyz1993/CodeNomad --add-label 'bug' 2>/dev/null || true
                echo "Added 'bug' label to #$NUMBER"
              fi
            fi
            
            if echo "$TITLE $BODY" | grep -qiE 'feature|request|enhancement|improve'; then
              if ! echo "$LABELS" | grep -q 'enhancement'; then
                gh issue edit "$NUMBER" --repo dyyz1993/CodeNomad --add-label 'enhancement' 2>/dev/null || true
                echo "Added 'enhancement' label to #$NUMBER"
              fi
            fi
          done

      - name: Create issue summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo dyyz1993/CodeNomad --state open --label 'triage-summary' --json number --jq '.[0].number // empty' 2>/dev/null || true)
          
          ISSUES=$(cat /tmp/issues.json)
          COUNT=$(echo "$ISSUES" | jq 'length')
          
          if [ "$COUNT" -gt 0 ]; then
            BODY="## 📋 Issue Triage Summary\n\nGenerated: $(date)\n\nOpen issues: $COUNT\n\n"
            BODY+="| # | Title | Labels |\n|---|-------|--------|\n"
            
            echo "$ISSUES" | jq -c '.[]' | while read -r issue; do
              NUM=$(echo "$issue" | jq -r '.number')
              TITLE=$(echo "$issue" | jq -r '.title')
              LABELS=$(echo "$issue" | jq -r '.labels | map(.name) | join(", ") // "none"')
              BODY+="| #$NUM | $TITLE | $LABELS |\n"
            done
            
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --repo dyyz1993/CodeNomad --body "$(echo -e "$BODY")" 2>/dev/null || true
            fi
          fi
